<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      content="Kesher AI follows market news and SEC filings and explains why each event matters to your portfolio, with the evidence behind it."

    <!-- Icons and the preview card come from npm run brand (apps/web/scripts/brand.ts). -->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kesher AI" />
    <meta property="og:title" content="Kesher AI" />

      content="The Kesher AI mark and wordmark: Market news, explained for your portfolio."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kesher AI" />

    <meta name="twitter:image" content="https://kesher-5ymr.onrender.com/og.png" />

      name="twitter:image:alt"
      content="The Kesher AI mark and wordmark: Market news, explained for your portfolio."
